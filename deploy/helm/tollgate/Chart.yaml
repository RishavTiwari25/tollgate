apiVersion: v2
name: tollgate
description: AI-aware multi-tenant rate limiting gateway and Kubernetes operator
type: application

# Two versions, and they mean different things — a distinction people get wrong
# constantly. `version` is the CHART's version and must bump on any template
# change. `appVersion` is the version of the SOFTWARE the chart deploys, and
# is what the default image tag follows.
version: 0.1.0
appVersion: "1.1.0"

keywords: [rate-limiting, gateway, operator, api-gateway, ext-authz, prometheus]
home: https://limitplane-rishav.vercel.app
sources:
  - https://github.com/RishavTiwari25/tollgate
maintainers:
  - name: Rishav Tiwari
    url: https://github.com/RishavTiwari25

annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: RateLimitPolicy
      version: v1alpha1
      name: ratelimitpolicies.tollgate.dev
      description: Plans and per-route pricing enforced by the gateway
    - kind: Tenant
      version: v1alpha1
      name: tenants.tollgate.dev
      description: One customer or site, and the API key that identifies them
